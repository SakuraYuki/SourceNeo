[package]
name = "sourceneo"
version = "0.1.3"
description = "A focused multi-repository Git companion"
edition = "2021"
rust-version = "1.90"

[lib]
name = "sourceneo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sourceneo"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state", "dep:objc2-foundation"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
dunce = "1"
fs2 = "0.4"
tempfile = "3"
libc = "0.2"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSLocale"], optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
