[package]
name = "sourceneo"
version = "0.1.1"
description = "A focused multi-repository Git companion"
edition = "2021"
rust-version = "1.90"

[lib]
name = "sourceneo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sourceneo"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-window-state"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
dunce = "1"
fs2 = "0.4"
tempfile = "3"
libc = "0.2"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2.5", optional = true }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
