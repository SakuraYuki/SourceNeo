name: Desktop checks and unsigned builds
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Prepare Rust
        run: rustup update stable --no-self-update
      - name: Install Rust checks
        run: rustup component add rustfmt clippy
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build unsigned desktop app
        run: npm run desktop:build -- --bundles ${{ matrix.bundle }}
      - name: Archive macOS app with executable permissions
        if: runner.os == 'macOS'
        run: tar -czf SourceNeo-macos.tar.gz -C src-tauri/target/release/bundle/macos SourceNeo.app
      - uses: actions/upload-artifact@v4
        with:
          name: SourceNeo-${{ matrix.os }}-unsigned
          path: |
            SourceNeo-macos.tar.gz
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
